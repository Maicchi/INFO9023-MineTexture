[project]
name = "info9023-minetexture"
version = "0.1.0"
description = "MineTexture Project"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "flask==3.1.2",
    "gunicorn==25.0.1",
    "google-cloud-bigquery==3.40.1",
    "google-cloud-firestore==2.23.0",
    "google-cloud-storage==3.9.0",
    "pillow==12.1.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
train = [
    "accelerate==1.6.0",
    "bitsandbytes>=0.49.2",
    "diffusers==0.32.1",
    "einops==0.7.0",
    "ftfy==6.3.1",
    "huggingface-hub==0.34.3",
    "imagesize==1.4.1",
    "lion-pytorch==0.2.3",
    "numpy>=2.4.2",
    "opencv-python==4.10.0.84",
    "pandas>=3.0.1",
    "prodigy-plus-schedule-free==1.9.2",
    "prodigyopt==1.1.2",
    "pytorch-optimizer==3.9.0",
    "rich==14.1.0",
    "safetensors==0.4.5",
    "schedulefree==1.4",
    "sentencepiece==0.2.1",
    "tensorboard>=2.20.0",
    "toml==0.10.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers==4.54.1",
    "voluptuous==0.15.2",
    "wandb>=0.25.0",
    "xformers>=0.0.35",
]

experiments = [
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "pandas==3.0.1"
]

inference = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio",
    "diffusers==0.32.1",
    "transformers==4.54.1",
    "accelerate==1.6.0",
    "safetensors==0.4.5",
    "pillow==12.1.1",
    "peft>=0.18.1",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "google-cloud-storage==3.9.0",
]

dev = [
    "pytest==9.0.2",
    "pre-commit==4.5.1",
    "ruff==0.9.2",
]

dashboard = [
    "flask==3.1.2",
    "google-cloud-storage==3.9.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
