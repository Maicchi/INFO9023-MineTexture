name: Python CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
    pre-commit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                pip install uv
                uv sync --frozen

            - name: Run pre-commit hooks
              run: |
                uv run pre-commit run --all-files --show-diff-on-failure --color=always

    pytest:
        runs-on: ubuntu-latest
        needs: pre-commit

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                pip install uv
                uv sync --frozen

            - name: Run tests
              run: |
                uv run pytest tests/
